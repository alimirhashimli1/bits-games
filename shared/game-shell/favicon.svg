<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Retro Console icon: a 16x16 pixel-art gamepad in the theme colours. -->
  <rect x="0" y="2" width="16" height="12" rx="0" fill="#0b0b1a"/>
  <!-- Body with stepped corners -->
  <path fill="#8a8aa8" d="M2 4h12v1h1v6h-1v1h-4v-1H6v1H2v-1H1V5h1z"/>
  <path fill="#f4f4f4" d="M2 4h12v1H2z"/>
  <!-- D-pad -->
  <path fill="#0b0b1a" d="M4 6h1v1h1v1H5v1H4V8H3V7h1z"/>
  <!-- A / B buttons -->
  <rect x="10" y="6" width="2" height="2" fill="#ffd23f"/>
  <rect x="12" y="8" width="2" height="2" fill="#ffd23f"/>
  <!-- Select / Start -->
  <rect x="7" y="9" width="2" height="1" fill="#0b0b1a"/>
</svg>
